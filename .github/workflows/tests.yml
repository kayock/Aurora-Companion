name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify deploy script syntax
        run: bash -n deploy/*.sh
      - name: Run application and integration tests
        run: python -m pytest tests/ -q --ignore=tests/test_updater.py --ignore=tests/test_update_helper.py
      - name: Run updater tests (excluding manifest subprocess)
        run: python -m pytest tests/test_updater.py -q -k 'not test_helper_manifest_validation'
      - name: Run updater manifest validation separately
        run: python -m pytest tests/test_updater.py::test_helper_manifest_validation -q
      - name: Run privileged-helper security tests separately
        run: python -m pytest tests/test_update_helper.py -q
